apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "frontend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
data:
  PORT: {{ .Values.frontend.service.port | quote }}
  NODE_ENV: {{ .Values.frontend.service.nodeEnv | quote }}
  # Read at runtime by the server-side route handlers in app/auth/. Deliberately not prefixed
  # NEXT_PUBLIC_, since Next.js would inline that into the bundle at build time and the value
  # could no longer differ per environment. The browser never sees it -- client components
  # call a relative /api on whatever host served them.
  BACKEND_API_URL: {{ include "user-mgmt.backend.internalUrl" . | quote }}
  # Which environment the UI says it is. Empty here means no banner at all -- see
  # frontend.environment in values.yaml.
  APP_ENV_LABEL: {{ .Values.frontend.environment.label | quote }}
  APP_ENV_TONE: {{ .Values.frontend.environment.tone | quote }}

