apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "frontend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  # As on the backend Service: round-robin over the ready endpoints. No server-side session
  # here either -- the JWT lives in a cookie -- so any replica can serve any user.
  sessionAffinity: None
  selector:
    {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: frontend
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
