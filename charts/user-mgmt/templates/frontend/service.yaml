apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "frontend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  # See the note on the backend Service: no affinity means round-robin over the ready
  # endpoints only. The frontend keeps no server-side session either -- the JWT lives in
  # a cookie the browser sends with every request -- so any replica can serve any user.
  sessionAffinity: None
  selector:
    {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: frontend
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
