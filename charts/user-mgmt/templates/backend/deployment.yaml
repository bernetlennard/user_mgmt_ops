apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # Omitted while an HPA owns this Deployment. ArgoCD runs with selfHeal: true, so a
  # `replicas` in the desired state would make every scale-out look like drift and be
  # reverted; an absent field is not diffed.
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        # A changed ConfigMap changes this hash, which changes the pod template and rolls
        # the pods so they pick the new value up.
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.backend.image.name }}
          image: {{ include "user-mgmt.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            # Actuator: the kubelet reaches it on the pod IP for the probes below, and,
            # when monitoring.enabled, the Service above and the ServiceMonitor next to it
            # publish it for Prometheus too. No Ingress ever references it.
            - name: management
              containerPort: {{ .Values.backend.management.port }}
          env:
            # Fully resolved by Helm from externalDatabase.* -- host, port, database name and
            # sslmode all come from values, no $(VAR) indirection. See the jdbcUrl helper for
            # why that indirection was removed along with the in-cluster database.
            - name: SPRING_DATASOURCE_URL
              value: {{ include "user-mgmt.database.jdbcUrl" $ | quote }}
            # Wired key by key rather than with envFrom: Spring reads SPRING_DATASOURCE_*, the
            # Secret stores the generic username/password keys Terraform emits, and envFrom
            # cannot rename keys.
            #
            # This Secret is NOT rendered by the chart -- it is created out of band from the
            # Terraform outputs (terraform/README.md), so the managed database's password never
            # enters git. That also means ArgoCD does not manage it and will not prune it.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.usernameKey }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.passwordKey }}
          envFrom:
            - secretRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
            - configMapRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.probes.startup }}
          # Suspends the other two probes until it succeeds once.
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
