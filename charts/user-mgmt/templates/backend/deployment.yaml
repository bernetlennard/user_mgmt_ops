apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # Omitted entirely when an HPA owns this Deployment, and that omission is the whole
  # point. ArgoCD runs with selfHeal: true -- if `replicas: 1` stayed in the rendered
  # manifest, every scale-out by the HPA would look like drift and be reverted within the
  # reconcile interval. A field that is absent from the desired state is not diffed, so
  # the two controllers stop fighting over it.
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Change a ConfigMap value -> this hash changes -> the pod template changes
        # -> the pod restarts and picks it up. `kubectl apply` never does this.
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.backend.image.name }}
          image: {{ include "user-mgmt.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            # Actuator. Declared for documentation only -- no Service and no Ingress
            # reference it, which is exactly what keeps /actuator off the public hostname.
            # The kubelet reaches it directly on the pod IP to run the probes below.
            - name: management
              containerPort: {{ .Values.backend.management.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
                  key: POSTGRES_DB
            # THE POINT OF THE WHOLE EXERCISE.
            # Was: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            # -- which only worked because the Service happened to be named exactly
            # `postgres`. Now that names are release-prefixed, that would break.
            - name: SPRING_DATASOURCE_URL
              value: {{ include "user-mgmt.postgres.jdbcUrl" $ | quote }}
            # Wired one by one rather than with envFrom, because the names have to change
            # on the way in: the credentials live in the Postgres Secret under POSTGRES_*
            # (shared with the Postgres pod) but application.properties reads them as
            # SPRING_DATASOURCE_*. envFrom cannot rename keys.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
            - configMapRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.probes.startup }}
          # Suspends the other two probes until it succeeds once, so a slow JVM start is
          # never mistaken for a hung process.
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
