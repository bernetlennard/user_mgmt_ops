apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # Omitted while an HPA owns this Deployment. ArgoCD runs with selfHeal: true, so a
  # `replicas` in the desired state would make every scale-out look like drift and be
  # reverted; an absent field is not diffed.
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        # A changed ConfigMap changes this hash, which changes the pod template and rolls
        # the pods so they pick the new value up.
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.backend.image.name }}
          image: {{ include "user-mgmt.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            # Actuator, declared for documentation only: no Service or Ingress references it,
            # and the kubelet reaches it on the pod IP to run the probes below.
            - name: management
              containerPort: {{ .Values.backend.management.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
                  key: POSTGRES_DB
            # Built from the release-prefixed Service name, so each release reaches its own
            # database.
            - name: SPRING_DATASOURCE_URL
              value: {{ include "user-mgmt.postgres.jdbcUrl" $ | quote }}
            # Wired key by key rather than with envFrom: the credentials live in the Postgres
            # Secret as POSTGRES_* but Spring reads them as SPRING_DATASOURCE_*, and envFrom
            # cannot rename keys.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
            - configMapRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.probes.startup }}
          # Suspends the other two probes until it succeeds once.
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
