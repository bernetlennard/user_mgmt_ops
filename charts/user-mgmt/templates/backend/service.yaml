apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  # Stated rather than defaulted: no affinity means any request may go to any ready endpoint,
  # while ClientIP would pin each client to one replica. Safe because the API is stateless --
  # authentication is a JWT in the request, not a server-side session. Traffic from the
  # internet does not use this ClusterIP at all: Traefik reads its ready endpoints and
  # round-robins over them itself (k6/README.md, "Reading").
  sessionAffinity: None
  selector:
    {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
  ports:
    - name: backend
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
    {{- if .Values.monitoring.enabled }}
    # The Actuator/metrics port. Named so the ServiceMonitor below can target it by name
    # instead of a hardcoded number, and published only for Prometheus -- the NetworkPolicy
    # still restricts who may actually reach it.
    - name: management
      port: {{ .Values.backend.management.port }}
      targetPort: {{ .Values.backend.management.port }}
    {{- end }}
