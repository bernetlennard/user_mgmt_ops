{{- if .Values.backend.autoscaling.enabled }}
# While this is enabled the HPA owns spec.replicas of the backend Deployment, which therefore
# stops rendering the field (see templates/backend/deployment.yaml).
#
# The autoscaler can only create pods the namespace ResourceQuota has room for. A quota that
# fits only the current replicas becomes the scaling limit, and says so as "exceeded quota" on
# the ReplicaSet rather than on the HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}-hpa
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") }}
  metrics:
    # Utilisation is measured against the container's cpu request, not its limit.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  {{- with .Values.backend.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
