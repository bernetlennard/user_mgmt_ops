{{- if .Values.networkPolicy.enabled }}
# Network isolation for this namespace: deny-by-default plus one allow policy per component.
# Policies are additive -- a pod is isolated the moment any policy selects it, and the union
# of the matching policies is what it may do.
#
# A pod in `staging` therefore cannot reach a pod in `prod`, because neither namespace's rules
# name the other. Blocked traffic is dropped, not refused, so it times out rather than failing
# fast. Requires a CNI that enforces NetworkPolicy; this cluster runs Cilium (DOKS default).
---
# 1. Deny everything, both directions. podSelector: {} covers pods this chart does not own
#    too -- the namespace is the boundary, not the release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-default-deny
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. DNS for every pod. Without it name lookups fail, which looks like a broken app rather
#    than a network policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-dns
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# 3. Frontend: reachable from the ingress controller only; may talk to the backend Service.
#    Internet egress is optional and off by default -- see networkPolicy.frontendExternalEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-frontend
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.frontend.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.port }}
          protocol: TCP
    {{- if .Values.networkPolicy.frontendExternalEgress.enabled }}
    - to:
        {{- range .Values.networkPolicy.frontendExternalEgress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.frontendExternalEgress.port }}
          protocol: TCP
    {{- end }}
---
# 4. Backend: reachable from the ingress controller (the /api path) and from the
#    frontend; may talk to Postgres. No internet egress -- it needs none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-backend
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.service.port }}
          protocol: TCP
---
# 5. Postgres: reachable from the backend in this namespace and from nowhere else. No egress
#    beyond the shared DNS policy -- the database initiates nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-postgres
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.service.port }}
          protocol: TCP
{{- end }}
