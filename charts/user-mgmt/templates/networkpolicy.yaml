{{- if .Values.networkPolicy.enabled }}
# Network isolation for this namespace: deny-by-default plus one allow policy per component.
# Policies are additive -- a pod is isolated the moment any policy selects it, and the union
# of the matching policies is what it may do.
#
# A pod in `staging` therefore cannot reach a pod in `prod`, because neither namespace's rules
# name the other. Blocked traffic is dropped, not refused, so it times out rather than failing
# fast. Requires a CNI that enforces NetworkPolicy; this cluster runs Cilium (DOKS default).
---
# 1. Deny everything, both directions. podSelector: {} covers pods this chart does not own
#    too -- the namespace is the boundary, not the release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-default-deny
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. DNS for every pod. Without it name lookups fail, which looks like a broken app rather
#    than a network policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-dns
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# 3. Frontend: reachable from the ingress controller only; may talk to the backend Service.
#    Internet egress is optional and off by default -- see networkPolicy.frontendExternalEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-frontend
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.frontend.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.port }}
          protocol: TCP
    {{- if .Values.networkPolicy.frontendExternalEgress.enabled }}
    - to:
        {{- range .Values.networkPolicy.frontendExternalEgress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.frontendExternalEgress.port }}
          protocol: TCP
    {{- end }}
---
# 4. Backend: reachable from the ingress controller (the /api path) and from the
#    frontend; may reach the managed database over the VPC. That database egress is the only
#    reason it leaves the namespace -- and because the endpoint is outside the cluster it has
#    to be expressed as an ipBlock: a podSelector can only ever match pod IPs, so the old
#    in-cluster rule would silently drop every connection to the managed endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-backend
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.port }}
          protocol: TCP
  egress:
    - to:
        {{- range .Values.networkPolicy.databaseEgress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.externalDatabase.port }}
          protocol: TCP
    {{- if .Values.moduleService.enabled }}
    # The module_service, through its Service. Cilium evaluates the rule after the Service's
    # virtual IP has been translated to a pod IP, so a podSelector is the right tool here.
    - to:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "module-service") | nindent 14 }}
      ports:
        - port: {{ .Values.moduleService.service.port }}
          protocol: TCP
    {{- end }}
{{- if .Values.moduleService.enabled }}
---
# 6. module_service: reachable only from the backend (and, via policy 7, Prometheus); may reach
#    only its managed MySQL over the VPC. Neither the frontend nor the ingress controller can
#    reach it, and it has no route to the Postgres port or the internet. This, together with
#    the MySQL credentials existing only in the module_service's Secret, is what keeps the
#    backend from accessing the module database directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-module-service
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "module-service") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 14 }}
      ports:
        - port: {{ .Values.moduleService.service.port }}
          protocol: TCP
  egress:
    - to:
        {{- range .Values.networkPolicy.moduleServiceDatabaseEgress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.moduleService.database.port }}
          protocol: TCP
{{- end }}
{{- if $.Values.monitoring.enabled }}
---
# 5. Monitoring: Prometheus (running in the `monitoring` namespace) may reach the backend's
#    Actuator/metrics port. This is additive to policy 4 above -- policy 4 still governs the
#    backend's egress and its ingress from the ingress controller/frontend on the app port;
#    this one only adds an ingress rule for the metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-monitoring
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - port: {{ .Values.backend.management.port }}
          protocol: TCP
{{- if .Values.moduleService.enabled }}
---
# 7. Monitoring for the module_service: Prometheus scrapes /metrics on the service port, which
#    policy 6 otherwise only opens to the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "user-mgmt.fullname" . }}-allow-monitoring-module-service
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "module-service") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - port: {{ .Values.moduleService.service.port }}
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
