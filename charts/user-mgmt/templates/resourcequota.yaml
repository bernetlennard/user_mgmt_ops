{{- if .Values.resourceQuota.enabled }}
# Caps the sum of requests and limits across every pod in the namespace this release is
# installed into.
#
# Because the quota names limits.cpu and limits.memory, Kubernetes requires every container in
# the namespace to declare both -- a container without them is rejected at admission, not
# throttled. Hence the explicit limits on all three components in values.yaml.
#
# Sizing rule: cover the worst case, not the steady state. A change touching every component
# rolls backend and frontend at once, and each RollingUpdate creates its replacement before
# retiring the old pod, so the ceiling has to fit one extra copy of every component that rolls.
# Too tight deadlocks the rollout at "exceeded quota". The per-environment sums are in
# values-prod.yaml and values-staging.yaml.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "user-mgmt.fullname" . }}-quota
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "quota") | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}
