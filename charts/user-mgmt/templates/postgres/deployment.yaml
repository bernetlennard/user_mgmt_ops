apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  # Defaults to Recreate -- see the comment on postgres.strategy in values.yaml.
  strategy:
    {{- toYaml .Values.postgres.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/postgres/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.postgres.image.name }}
          image: {{ include "user-mgmt.image" .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
            - configMapRef:
                name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.postgres.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.postgres.probes.liveness | nindent 12 }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
