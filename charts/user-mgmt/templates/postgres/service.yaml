apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-mgmt.componentName" (dict "ctx" $ "component" "postgres") }}
  labels:
    {{- include "user-mgmt.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "user-mgmt.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
