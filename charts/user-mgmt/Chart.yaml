apiVersion: v2
name: user-mgmt
description: User management stack - Spring Boot backend, Next.js frontend and the FastAPI module_service, backed by DigitalOcean Managed PostgreSQL and MySQL

type: application

# Version of the chart itself; bump on every change to templates or values.
# 0.3.0: the in-cluster PostgreSQL (Deployment/Service/PVC/Secret/ConfigMap) is gone; the
# backend now points at a managed database provisioned in terraform/.
# 0.3.1: the error-rate PrometheusRule only evaluates its own release's namespace.
# 0.4.0: the module_service (Aufgabe 6): Deployment with migrate init container, Service,
# ServiceMonitor, PrometheusRule, PDB and NetworkPolicies; the backend reaches it by URL.
# 0.4.1: the backend pods roll when the chart's Secret (JWT_SECRET) changes (checksum/secret).
version: 0.4.1
# Version of the application being deployed.
appVersion: "0.1.0"
icon: https://helm.sh/img/helm.svg
