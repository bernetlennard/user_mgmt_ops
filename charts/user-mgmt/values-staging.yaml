# Overlay for the staging environment (namespace `staging`).
#
# Applied by the ArgoCD Application argocd/application-staging.yaml, layered on top of
# values.yaml. Staging is the tighter of the two environments: no public ingress, lower
# cpu ceilings, a smaller namespace quota.

# Staging has its own public hostname, served by the same Traefik as prod.
#
# `hosts` MUST be the complete list, not an addition: Helm replaces the list wholesale, and
# anything left out here is NOT inherited -- but anything left IN that belongs to prod would
# create a second Ingress object claiming prod's hostname, and Traefik would route it
# unpredictably. Exactly one environment may own a given host.
#
# Safe to expose only since the frontend resolves its api at runtime (BACKEND_API_URL for
# the server-side handlers, a relative /api for the browser). Before that, the api address
# was baked into the image and pointed at prod -- an exposed staging would have written
# into prod's database.
ingress:
  enabled: true
  hosts:
    - vcs-staging.lennardbernet.ch
    - vcs-staging.linosteiner.ch

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

backend:
  # 750m instead of prod's 1 core. Still comfortably above what JVM startup needs inside
  # the readiness window; do not drop this to 500m or below or the rollout starts to flap.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 750m
      # Memory limit stays at the prod value: the JVM sizes its heap from it
      # (-XX:MaxRAMPercentage=60), so lowering it here would risk an OOM kill that
      # prod would not have.
      memory: 700Mi

frontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Namespace ceiling for `staging`.
#
# Arithmetic behind the numbers, with the limits set above:
#   steady state limits   = 200m + 750m + 200m  = 1150m cpu / 1212Mi memory
#   steady state requests =  50m + 100m +  50m  =  200m cpu /  640Mi memory
#
# The ceiling has to clear the WORST CASE, not the steady state: a chart change that
# touches every component (a cpu limit, an image tag, a checksum annotation) rolls
# backend and frontend at the same time, and each RollingUpdate creates its replacement
# before retiring the old pod. Postgres is `strategy: Recreate`, so it never surges.
#   worst case limits   = 1150m + 750m + 200m = 2100m cpu / 2168Mi memory
#   worst case requests =  200m + 100m +  50m =  350m cpu / 1152Mi memory
#   worst case pods     = 3 + 2                = 5
# A quota sized to the steady state alone does not slow that rollout down -- it
# deadlocks it, and the Deployment sits at "exceeded quota" until someone notices.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: 600m
    requests.memory: 1536Mi
    limits.cpu: "3"
    limits.memory: 2560Mi
    pods: "8"
    persistentvolumeclaims: "2"

# Deny-by-default networking; see templates/networkpolicy.yaml for the five objects
# this switch creates. Selector values are inherited from values.yaml.
networkPolicy:
  enabled: true
