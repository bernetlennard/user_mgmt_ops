# Overlay for the staging environment (namespace `staging`), applied by
# argocd/application-staging.yaml on top of values.yaml.
#
# Staging is the tighter of the two: lower cpu ceilings, a smaller quota, single-replica
# components. That was a capacity decision on the original 2 vCPU / 4 GB node shared by both
# namespaces, where a second staging replica would have consumed exactly the headroom prod's
# autoscaler needed (see the header of values-prod.yaml for the resize since).

# Staging's own public hostnames, served by the same Traefik as prod.
# `hosts` must be the complete list: Helm replaces it wholesale, so anything left out is not
# inherited -- and anything of prod's left in would create a second Ingress claiming prod's
# hostname. Exactly one environment may own a given host.
ingress:
  enabled: true
  hosts:
    - vcs-staging.lennardbernet.ch
    - vcs-staging.linosteiner.ch

# Staging's own logical database and user on the shared managed Postgres cluster. host/port
# come from `terraform output database_private_host` / `database_port`; the credentials live
# in the `user-mgmt-db` Secret in this namespace, created out of band (terraform/README.md).
externalDatabase:
  database: user_mgmt_staging

backend:
  # 750m cpu instead of prod's full core, still above what JVM startup needs inside the
  # startupProbe window. Do not go to 500m or below or the rollout starts to flap. The memory
  # limit stays at the prod value because the JVM sizes its heap from it (MaxRAMPercentage=60).
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 750m
      memory: 700Mi

  # Enabled so both environments run the same mechanism, not because staging carries load.
  # 1 -> 2 is what the shared node has left once prod has taken its headroom.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  # maxUnavailable, not minAvailable: at minReplicas 1 a `minAvailable: 1` budget would permit
  # zero voluntary disruptions, so a node drain would block forever. "At most one may go at a
  # time" expresses the same intent and still lets maintenance proceed.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

frontend:
  # One replica: staging is the preview environment, prod is the HA one. See the header.
  replicaCount: 1
  # Amber "STAGING" strip above every page, so a screenshot or a stray browser tab is
  # never mistaken for production. Prod deliberately leaves this empty and shows nothing.
  environment:
    label: Staging
    tone: warning
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# Staging's own logical database on the shared managed MySQL (terraform/mysql.tf). One replica,
# like the rest of staging; resources are inherited from values.yaml.
moduleService:
  replicaCount: 1
  database:
    name: module_service_staging
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# Namespace ceiling for `staging`. Worst case is the autoscaler at maxReplicas during a
# rollout: backend 2 + 1 surge = 3 pods, frontend 1 + 1 = 2, module_service 1 + 1 = 2. The
# databases are managed services outside the cluster and consume no namespace quota at all.
# (A pod's init container counts with the larger of its own and the app container's resources;
# the module_service's migrate container uses the same numbers, so it adds nothing.)
#
#   pods            = 3 backend + 2 frontend + 2 module          =    7
#   requests.cpu    = 3x100m + 2x50m  + 2x50m                    =  500m
#   requests.memory = 3x320Mi + 2x96Mi + 2x128Mi                 = 1408Mi
#   limits.cpu      = 3x750m + 2x200m + 2x500m                   = 3650m
#   limits.memory   = 3x700Mi + 2x256Mi + 2x256Mi                = 3124Mi
#
# The module_service pushed both limits over the old ceilings (3 / 3Gi), so they were raised
# to 4 / 4Gi: a limit that the worst case exceeds does not slow a rollout down, it deadlocks it
# at "exceeded quota" -- and for the backend it would silently cap the autoscaler.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: 600m
    requests.memory: 1536Mi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "8"
    # The postgres PVC was the chart's only one, so real usage is now 0. Kept as a guard rail
    # against a stray PVC appearing, not because anything claims one.
    persistentvolumeclaims: "2"

# Deny-by-default networking; see templates/networkpolicy.yaml. Selector values are inherited
# from values.yaml.
networkPolicy:
  enabled: true
