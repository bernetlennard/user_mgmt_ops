# Base values. Each environment layers values-prod.yaml or values-staging.yaml on top.
#
# Every container declares cpu and memory limits: the namespace ResourceQuota caps limits.*,
# and Kubernetes rejects containers without them. Requests sit close to measured usage
# because the cluster is a single small node -- the arithmetic is in docs/scaling.md.

# DigitalOcean Managed PostgreSQL (Aufgabe 4). The chart no longer runs a database of its
# own -- no Deployment, no Service, no PVC -- it only points the backend at an external
# endpoint provisioned by terraform/ (see terraform/database.tf).
#
# host/port come from `terraform output database_private_host` / `database_port`. The private
# host keeps traffic on DigitalOcean's VPC instead of the public internet; the port is
# assigned per cluster and is deliberately NOT 5432, so nothing here may assume that.
#
# The credentials are NOT in this file: the username and password live in a Kubernetes Secret
# created out of band from the Terraform outputs (see terraform/README.md). The chart only
# holds that Secret's name and key names, so no database password ever lands in git -- a
# stricter rule than the JWT secret below, because this one guards data outside the cluster.
externalDatabase:
  # Shared by both environments -- one managed cluster, one logical database per release.
  # The `private-` prefix is what keeps this on the VPC; the public hostname (same name
  # without the prefix) would route over the internet and is not allowed by the Trusted
  # Sources firewall in terraform/database.tf.
  host: private-user-mgmt-postgres-do-user-39792807-0.m.db.ondigitalocean.com
  port: 25060
  # No default on purpose -- set per environment, and `required` in the jdbcUrl helper so a
  # missing value fails the render instead of producing a wrong URL.
  database: ""
  sslMode: require
  # Secret holding the credentials. Created out of band; the chart never renders it, so
  # ArgoCD neither manages nor prunes it.
  existingSecret: user-mgmt-db
  usernameKey: username
  passwordKey: password
backend:
  image:
    name: backend
    repository: xxpirl2knc5/user_mgmt_service
    # Owned by the promote pipeline in the app repo. Edit by hand only to roll back.
    tag: "6aaf872d070b23a967d6ec1108d3ccd4c76784e2"
    # The tag is an immutable commit SHA, so a cached layer can never be stale.
    pullPolicy: IfNotPresent
  # Only used when autoscaling is disabled; with an HPA the Deployment omits spec.replicas.
  replicaCount: 1
  # maxUnavailable 0: the replacement pod must be Ready before an old one is taken away, so
  # the number of serving pods never dips. The price is one extra pod during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    port: 8080
  # Actuator's port. No Service and no Ingress reference it, so /actuator stays off the public
  # hostname -- only the kubelet reaches it on the pod IP. The anchor is reused by the probes.
  management:
    port: &backendManagementPort 8081
  config:
    jwtIssuer: user-mgmt-service
    jwtExpirationMillis: 3600000
    ddlAuto: update
    contextPath: /api
    javaToolOptions: "-XX:MaxRAMPercentage=60"
  # HS256 signing key, 512 bit. Plain text because this repo is private -- see README, "Secrets".
  jwtSecret: "VIJQAsGSlarKapEGDwf1MgTiTIzvQJPEktgdisQeuRzjeUu1srpGNpbfhdnUPSZXYduiUAkNbMnKdQShQ7mFXw=="
  # The cpu limit is generous on purpose: a throttled JVM starts slowly, and a limit costs
  # nothing while idle. The cpu request is the HPA's sensitivity dial -- utilisation is
  # measured against it, so lowering it makes the autoscaler twitchier.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: "1"
      memory: 700Mi
  # All three probes hit Spring Boot Actuator on the management port, never the service port.
  probes:
    # Suspends readiness and liveness until it succeeds once, so a slow JVM start is not
    # mistaken for a hung process. 30 x 5s = 150s of grace, then the container is restarted.
    startup:
      httpGet:
        path: /actuator/health/liveness
        port: *backendManagementPort
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 3
    # Governs Service membership. The readiness group includes the `db` indicator, so a pod
    # that lost Postgres leaves the EndpointSlice instead of accepting requests it cannot serve.
    readiness:
      httpGet:
        path: /actuator/health/readiness
        port: *backendManagementPort
      periodSeconds: 5
      failureThreshold: 3
      timeoutSeconds: 3
    # Governs restarts, so it reacts to a broken process only. livenessState excludes the
    # database: a Postgres outage must not turn into a restart loop of every backend pod.
    liveness:
      httpGet:
        path: /actuator/health/liveness
        port: *backendManagementPort
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # Off here, on in both overlays, which is where the per-environment numbers live.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    # Relative to the cpu request above, not the limit: 70% of 100m.
    targetCPUUtilizationPercentage: 70
    # CPU only. A JVM does not return heap to the OS, so a memory target would never scale down.
    behavior:
      scaleUp:
        # Load arrives faster than a JVM starts, so there is nothing to gain from waiting.
        stabilizationWindowSeconds: 0
      scaleDown:
        # Five minutes of calm before giving a replica back; scaling down early causes flapping.
        stabilizationWindowSeconds: 300
  # Enabling this requires exactly one of minAvailable / maxUnavailable -- the template fails
  # on both or neither. Which one is correct depends on the replica count, so each overlay
  # sets its own.
  podDisruptionBudget:
    enabled: false
frontend:
  image:
    name: auth-portal
    repository: xxpirl2knc5/auth_portal
    # Owned by the promote pipeline in the auth_portal repo. Edit by hand only to roll back.
    tag: "7c5429f06c75629d526eea526544e4f16ae09ca9"
    # The tag is an immutable commit SHA, so a cached layer can never be stale.
    pullPolicy: IfNotPresent
  # No HPA: Next.js serving pre-rendered pages is not CPU-bound, so a cpu target would never
  # fire. Availability is what matters here, so prod pins a fixed count above 1 plus a PDB.
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    port: 3000
    nodeEnv: "production"
  environment:
    label: ""
    tone: warning
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  probes:
    readiness:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 6
    liveness:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 3
  # Same either/or rule as the backend's, and likewise configured per environment.
  podDisruptionBudget:
    enabled: false
ingress:
  enabled: true
  className: traefik
  hosts:
    - vcs.lennardbernet.ch
    - vcs.linosteiner.ch
  tls:
    enabled: true
    certResolver: letsencrypt

# Namespace guardrails. Both objects are namespace-scoped, so each environment gets its own
# copy; they ship disabled here and the real numbers live in the two overlays.

resourceQuota:
  enabled: false
  # Anything valid in ResourceQuota.spec.hard. The ceiling has to cover the worst case:
  # every component at its maximum replica count plus one surge pod each. Too tight does not
  # slow a rollout down, it deadlocks it at "exceeded quota". Per-environment sums are in
  # values-prod.yaml and values-staging.yaml.
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "12"
    persistentvolumeclaims: "2"

# Wiring for the kube-prometheus-stack Helm release (a separate install, in its own
# `monitoring` namespace -- see monitoring/values.yaml at the repo root for that stack's own
# configuration). On by default in every environment; there is no per-environment reason to
# turn it off, unlike resourceQuota/networkPolicy above.
monitoring:
  enabled: true
  # Namespace the kube-prometheus-stack release lives in. Both the ServiceMonitor's
  # namespaceSelector context and the allow-monitoring NetworkPolicy rule key off this.
  namespace: monitoring
  # kube-prometheus-stack's Prometheus CR only loads ServiceMonitors/PrometheusRules that
  # carry this label -- it is the name of THAT Helm release, not of this one, and has nothing
  # to do with which namespace the object lives in.
  prometheusReleaseLabel: prometheus-stack
  serviceMonitor:
    path: /actuator/prometheus
    interval: 15s
  prometheusRule:
    # Must match management.metrics.tags.application in
    # user_mgmt_service/src/main/resources/application.properties.
    applicationTag: user-mgmt-service
    errorRateThreshold: 0.05
    for: 5m
    severity: warning

networkPolicy:
  enabled: false
  # Namespace running CoreDNS, selected by the kubernetes.io/metadata.name label that
  # Kubernetes maintains on every namespace.
  dnsNamespace: kube-system
  # The only pods outside this namespace that may reach the frontend and the backend.
  ingressController:
    namespace: default
    podLabels:
      app: traefik
  # Off: the frontend resolves the api in-cluster and self-hosts its fonts, so it has no
  # reason to leave the namespace. Port and cidrs stay here in case that ever changes.
  frontendExternalEgress:
    enabled: false
    port: 443
    cidrs:
      - 0.0.0.0/0
  # The backend's database now lives OUTSIDE the cluster (DigitalOcean Managed Postgres), so
  # its egress rule can no longer be a podSelector -- those only ever match pod IPs. This has
  # to be an ipBlock, and it is the single reason the backend is allowed to leave the
  # namespace at all.
  #
  # The CIDR is the VPC the cluster and the database share, from
  # `terraform output vpc_ip_range`. Scoped to the VPC rather than 0.0.0.0/0 so a compromised
  # backend still cannot reach the public internet. Port comes from externalDatabase.port.
  databaseEgress:
    cidrs:
      - 10.114.0.0/20
