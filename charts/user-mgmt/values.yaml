postgres:
  database: user_mgmt_db
  auth:
    username: admin
    password: admin
  image:
    name: postgres
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 5432
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so two Postgres pods can
  # never hold the data volume at once. Overridable, but do not.
  strategy:
    type: Recreate
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
  # The cpu limit is mandatory, not tuning: the namespace ResourceQuota (Aufgabe 5)
  # declares limits.cpu, and Kubernetes rejects every pod in that namespace that does
  # not declare one of its own. Same reasoning for the other two components.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  probes:
    readiness:
      exec:
        command: [ "sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' ]
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      exec:
        command: [ "sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' ]
      initialDelaySeconds: 15
      periodSeconds: 20
backend:
  image:
    name: backend
    repository: xxpirl2knc5/user_mgmt_service
    # Owned by the pipeline: the build-and-promote workflow in the app repo rewrites this
    # line to the commit SHA it just pushed. Edit it by hand only to roll back.
    tag: "d9c59c3dfdf60dc8d9ccb7a522ca8454d2a5c461"
    # IfNotPresent, not Always: the tag is an immutable commit SHA, so a pod that already
    # has the layer can never be looking at a stale image.
    pullPolicy: IfNotPresent
  replicaCount: 1
  strategy:
    type: RollingUpdate
  service:
    port: 8080
  config:
    jwtIssuer: user-mgmt-service
    jwtExpirationMillis: 3600000
    ddlAuto: update
    contextPath: /api
    javaToolOptions: "-XX:MaxRAMPercentage=60"
  # HS256 signing key, 512 bit. Committed here because this repo is private -- see the
  # "Secrets" section in README.md for why that is a deliberate simplification.
  jwtSecret: "VIJQAsGSlarKapEGDwf1MgTiTIzvQJPEktgdisQeuRzjeUu1srpGNpbfhdnUPSZXYduiUAkNbMnKdQShQ7mFXw=="
  # 1 core, deliberately generous: a cpu limit throttles JVM startup, and the readiness
  # probe only allows 20s + 6x5s before the rollout is considered failed. Limits are
  # ceilings, not reservations -- an idle pod costs nothing for having a high one.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 700Mi
  probes:
    readiness:
      tcpSocket: { port: 8080 }
      initialDelaySeconds: 20
      periodSeconds: 5
      failureThreshold: 6
    liveness:
      tcpSocket: { port: 8080 }
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 3
  autoscaling: # <-- Aufgabe 6, shipped disabled
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget: # <-- Aufgabe 6, shipped disabled
    enabled: false
    minAvailable: 1
frontend:
  image:
    name: auth-portal
    # The repository CI actually publishes to. bernetlennard/auth_portal was a hand-pushed
    # :latest that no pipeline ever writes -- pointing the chart at it meant the cluster
    # ran whatever was last uploaded by hand.
    repository: xxpirl2knc5/auth_portal
    # Owned by the pipeline: the build-and-promote workflow in the auth_portal repo
    # rewrites this line to the commit SHA it just pushed. Edit it by hand only to roll back.
    tag: "78f99c0e4d8ad4d31732dd28f0ed5b10a90bae97"
    # IfNotPresent, not Always: the tag is an immutable commit SHA, so a pod that already
    # has the layer can never be looking at a stale image.
    pullPolicy: IfNotPresent
  replicaCount: 1
  strategy:
    type: RollingUpdate
  service:
    port: 3000
    nodeEnv: "production"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  probes:
    readiness:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 6
    liveness:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 3
ingress:
  enabled: true
  className: traefik
  hosts:
    - vcs.lennardbernet.ch
    - vcs.linosteiner.ch
  tls:
    enabled: true
    certResolver: letsencrypt

# --- Aufgabe 5: namespace guardrails -----------------------------------------------
# Both objects below are namespace-scoped, so each environment gets its own copy with
# its own numbers. They ship DISABLED here on purpose: the real values live in
# values-prod.yaml and values-staging.yaml, which is what makes the difference between
# the environments visible in one place instead of buried in the base file.

resourceQuota:
  enabled: false
  # Anything valid in ResourceQuota.spec.hard. Sizing rule (see resourcequota.yaml):
  #   hard.*  >=  sum over all components  +  one extra copy of every component that rolls
  # A RollingUpdate creates the replacement before retiring the old pod, and a chart change
  # touching every component (a cpu limit, an image tag, a checksum annotation) rolls
  # backend and frontend at the SAME time -- budgeting for a single surge pod is not enough.
  # Postgres is `strategy: Recreate` and never surges. Too tight a quota does not slow the
  # rollout down, it deadlocks it at "exceeded quota".
  # Headroom is deliberate on the limits side: Aufgabe 6 scales the backend to 4 replicas,
  # and 4 x 1 core of limit plus the other two components already needs 4.6 cores. A quota
  # that fits only today's three pods would make itself the thing that blocks the HPA.
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "12"
    persistentvolumeclaims: "2"

networkPolicy:
  enabled: false
  # Namespace running CoreDNS. Selected by the kubernetes.io/metadata.name label, which
  # Kubernetes maintains on every namespace itself -- no manual labelling required.
  dnsNamespace: kube-system
  # Where the ingress controller lives, and how to select its pods. Only these pods may
  # reach the frontend and the backend from outside the namespace.
  ingressController:
    namespace: default
    podLabels:
      app: traefik
  # Egress to the public internet for the frontend. OBSOLETE, and therefore off.
  #
  # It existed because the Next.js route handlers in app/auth/ called the PUBLIC api url
  # that Next.js inlined into the image at build time: the pod had to leave the cluster
  # and come back in through Traefik just to reach a backend two Services away. Now that
  # the api address is resolved at runtime -- BACKEND_API_URL points at the in-cluster
  # Service, and the browser calls a relative /api -- the frontend pod has no reason to
  # talk to anything outside its own namespace.
  #
  # Fonts are self-hosted by next/font at build time, so nothing else needs it either.
  # Flip back to true if a feature ever genuinely requires outbound calls; port and cidrs
  # stay here so that remains a one-line change.
  frontendExternalEgress:
    enabled: false
    port: 443
    cidrs:
      - 0.0.0.0/0
