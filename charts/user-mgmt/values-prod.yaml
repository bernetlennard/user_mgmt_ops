# Overlay for the production environment (namespace `prod`), applied by
# argocd/application-prod.yaml on top of values.yaml.
#
# Prod is the environment that runs horizontally: an autoscaled backend and a two-replica
# frontend, both protected by a PDB. The per-pod resources repeat the values.yaml defaults on
# purpose, so the difference to staging is readable in one file.
#
# The replica ceilings below were sized for the cluster's original 2 vCPU / 4 GB node, where
# both namespaces together had 1263m / 2156Mi left and memory ran out long before cpu. The
# node has since been resized to s-4vcpu-8gb (terraform/variables.tf) to make room for the
# monitoring stack and Kyverno; the ceilings were deliberately kept, so the node is no longer
# the binding constraint -- raise maxReplicas only together with the ResourceQuota below.

# Prod's own logical database and user on the shared managed Postgres cluster. host/port come
# from `terraform output database_private_host` / `database_port`; the credentials live in the
# `user-mgmt-db` Secret in this namespace, created out of band (terraform/README.md).
externalDatabase:
  database: user_mgmt_prod

backend:
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: "1"
      memory: 700Mi

  # minReplicas 2 is the HA requirement: with one replica every rollout and eviction is an
  # outage. maxReplicas 3 is what the original 4 GB node had room for -- steady state across
  # both namespaces was 1440Mi of 2156Mi, and the remaining 716Mi fitted one scale-out step
  # (320Mi) plus the surge pod of a rollout (320Mi), but not a second step.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

  # minAvailable, because prod runs at least two replicas: a drain may take one and must leave
  # the other serving. ALLOWED DISRUPTIONS in `kubectl get pdb` should read 1; at 0 the PDB
  # blocks drains instead of surviving them.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

frontend:
  # Two replicas: not CPU-bound, so an HPA would never fire, but a second pod makes the Ingress
  # round-robin observable on `/` and lets one pod go away without an outage.
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Prod's own logical database on the shared managed MySQL (terraform/mysql.tf). Two replicas
# for availability -- a rollout or a node drain never takes the module endpoints down -- not
# for capacity: the module_service scales vertically, through its limits in values.yaml.
moduleService:
  replicaCount: 2
  database:
    name: module_service_prod
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Namespace ceiling for `prod`. Worst case is the autoscaler at maxReplicas during a rollout:
# backend 3 + 1 surge = 4 pods, frontend 2 + 1 = 3, module_service 2 + 1 = 3. The databases
# are managed services outside the cluster and consume no namespace quota.
#
#   pods            = 4 backend + 3 frontend + 3 module          =   10
#   requests.cpu    = 4x100m + 3x50m + 3x50m                     =  700m
#   requests.memory = 4x320Mi + 3x96Mi + 3x128Mi                 = 1952Mi
#   limits.cpu      = 4x1000m + 3x300m + 3x1000m                 = 7900m
#   limits.memory   = 4x700Mi + 3x256Mi + 3x256Mi                = 4336Mi
#
# The module_service pushed the two limits over the old ceilings (6 / 4Gi); raised to 8 / 5Gi.
# Limits are not reserved on the node (requests are), so this overcommits the 4 cores only in
# the unlikely case that every pod bursts at once.
# requests.memory at 2Gi now has less than 100Mi of headroom -- the first thing to raise if
# any component grows.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "8"
    limits.memory: 5Gi
    pods: "12"
    # The postgres PVC was the chart's only one, so real usage is now 0. Kept as a guard rail
    # against a stray PVC appearing, not because anything claims one.
    persistentvolumeclaims: "2"

# Deny-by-default networking; see templates/networkpolicy.yaml. Selector values are inherited
# from values.yaml. Every rule selects pods by label, so new replicas are covered automatically.
networkPolicy:
  enabled: true
