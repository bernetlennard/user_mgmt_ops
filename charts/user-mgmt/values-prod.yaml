# Overlay for the production environment (namespace `prod`), applied by
# argocd/application-prod.yaml on top of values.yaml.
#
# Prod is the environment that runs horizontally: an autoscaled backend and a two-replica
# frontend, both protected by a PDB. The per-pod resources repeat the values.yaml defaults on
# purpose, so the difference to staging is readable in one file.
#
# The binding constraint is the node, not the quota. Both namespaces share one 2 vCPU / 4 GB
# node with 1263m / 2156Mi available to them together, and memory runs out long before cpu
# does. See docs/scaling.md.

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

backend:
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: "1"
      memory: 700Mi

  # minReplicas 2 is the HA requirement: with one replica every rollout and eviction is an
  # outage. maxReplicas 3 is what the node has room for -- steady state across both namespaces
  # is 1440Mi of 2156Mi, and the remaining 716Mi fits one scale-out step (320Mi) plus the surge
  # pod of a rollout (320Mi), but not a second step.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

  # minAvailable, because prod runs at least two replicas: a drain may take one and must leave
  # the other serving. ALLOWED DISRUPTIONS in `kubectl get pdb` should read 1; at 0 the PDB
  # blocks drains instead of surviving them.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

frontend:
  # Two replicas: not CPU-bound, so an HPA would never fire, but a second pod makes the Ingress
  # round-robin observable on `/` and lets one pod go away without an outage.
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Namespace ceiling for `prod`. Worst case is the autoscaler at maxReplicas during a rollout:
# backend 3 + 1 surge = 4 pods, frontend 2 + 1 = 3, postgres 1 (Recreate, never surges).
#
#   pods            = 4 backend + 3 frontend + 1 postgres          =    8
#   requests.cpu    =  50m + 4x100m + 3x50m                        =  600m
#   requests.memory =  96Mi + 4x320Mi + 3x96Mi                     = 1664Mi
#   limits.cpu      = 300m + 4x1000m + 3x300m                      = 5200m
#   limits.memory   = 256Mi + 4x700Mi + 3x256Mi                    = 3824Mi
#
# The numbers below clear that with room to spare: the node should be what runs out first, so
# the quota stays a guard rail rather than becoming the scaling limit itself.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "12"
    persistentvolumeclaims: "2"

# Deny-by-default networking; see templates/networkpolicy.yaml. Selector values are inherited
# from values.yaml. Every rule selects pods by label, so new replicas are covered automatically.
networkPolicy:
  enabled: true
