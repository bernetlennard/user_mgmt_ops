apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bernetlennard/user_mgmt_ops.git
    targetRevision: HEAD
    path: charts/user-mgmt
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
