                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "100 * (sum by (namespace) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\", status=~\"5..\"}[$__rate_interval])) or 0 * sum by (namespace) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval]))) / sum by (namespace) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} 5xx"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "B",
                    "expr": "100 * (sum by (namespace) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\", status=~\"4..\"}[$__rate_interval])) or 0 * sum by (namespace) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval]))) / sum by (namespace) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} 4xx"
                  }
                ]
              },
              {
                "id": 5,
                "type": "timeseries",
