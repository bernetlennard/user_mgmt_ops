                    "legendFormat": "{{pod}}"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "B",
                    "expr": "max by (namespace) (kube_pod_container_resource_limits{namespace=~\"$namespace\", container=\"backend\", resource=\"memory\"})",
                    "legendFormat": "{{namespace}} limit"
                  }
                ]
              }
            ],
            "description": "Alle Anfragen, inklusive k6-Lasttests: Durchsatz, Antwortzeit, Fehler, Skalierung. Orange hinterlegt = ein k6-Lasttest lief. Für den normalen Betrieb ohne Lasttests: \"user_mgmt - Ruhiger Betrieb\".",
            "annotations": {
