              ]
            },
            "links": [
              {
                "title": "user_mgmt Dashboards",
                "type": "dashboards",
                "tags": [
                  "user-mgmt"
                ],
                "asDropdown": true,
                "includeVars": true,
                "keepTime": false
              }
            ]
