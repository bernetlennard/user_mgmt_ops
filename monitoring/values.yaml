                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "100 * sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container=\"backend\"}[$__rate_interval])) / sum by (namespace, pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", container=\"backend\", resource=\"cpu\"})",
                    "legendFormat": "{{pod}}"
                  }
                ]
              },
              {
                "id": 9,
                "type": "timeseries",
                "title": "Memory per Pod",
                "description": "Working set per backend pod, against the container's memory limit.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 16,
                  "y": 25
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "min": 0,
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10
                    }
                  },
                  "overrides": []
