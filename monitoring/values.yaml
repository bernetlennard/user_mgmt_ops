# Declarative configuration for the kube-prometheus-stack Helm release ("prometheus-stack" in
# the `monitoring` namespace). This is a separate Helm release from charts/user-mgmt -- it is
# NOT deployed through ArgoCD (both Application objects in argocd/ only track charts/user-mgmt)
# -- so applying changes here means re-running the helm upgrade command in monitoring/README.md
# by hand. See that file for the full install/upgrade procedure, including the CRD-install
# step a completely fresh cluster needs before this chart's ServiceMonitor/PrometheusRule
# objects (from charts/user-mgmt) can exist at all.
#
# Chart version this was written against: kube-prometheus-stack-91.2.3 (app v0.94.0).

# DigitalOcean runs the control plane (etcd, scheduler, controller-manager) off-cluster, and
# Cilium replaces kube-proxy entirely -- confirmed via `kubectl -n kube-system get endpoints`:
# all four of the chart's own Services for these exist but have zero endpoints, permanently.
# Disabling them removes their ServiceMonitor, alerting rules and dashboard together, instead
# of leaving permanently-empty dashboards around.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# This cluster's nodes are all Linux -- the AIX/macOS variants of the Node Exporter dashboard
# are chart-bundled alternates for those OSes and would stay empty forever here.
nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

# Every component below gets explicit requests/limits. Chart defaults leave several of them
# unset, which makes those pods BestEffort QoS -- the first thing the kubelet kills under
# memory pressure. That's exactly what happened to Grafana on this cluster's original 4GB
# node before it was resized to 8GB: see the eviction event in `kubectl describe pod` history
# ("The node was low on resource: memory ... request is 0").

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # 7 days is plenty for a course project and keeps disk/memory bounded; the default is 10d.
    retention: 7d
    # Belt-and-braces: kube-prometheus-stack already sets these selectors to match the
    # `release: prometheus-stack` label when left nil (serviceMonitorSelectorNilUsesHelmValues
    # etc. default to true), which is exactly the label charts/user-mgmt's ServiceMonitor and
    # PrometheusRule carry. Spelled out explicitly here so the coupling isn't hidden in a
    # chart default someone has to go look up.
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Real notification channel (wired 2026-09-14): ntfy.sh, a free public push-notification
  # service -- no account needed on either end, subscribe to the topic in the ntfy app or at
  # https://ntfy.sh/<topic> to receive it. Chosen over Slack because no Slack workspace was
  # available.
  #
  # The topic name is effectively the channel's address: anyone who knows it can publish to
  # it or subscribe to read it (ntfy has no built-in auth for the free public instance). It's
  # not a credential in the Slack-webhook sense -- worst case someone spams the topic with
  # junk notifications, nothing is exposed or compromised -- so it's fine as plain text in a
  # private repo, same reasoning as the backend's JWT secret (see README, "Secrets"). Rotate
  # it any time by picking a new random topic name; nothing else depends on the old one.
  #
  # webhook_configs always POSTs Alertmanager's own fixed JSON payload -- there's no way to
  # template a custom message body for it (unlike email/Slack receivers) -- so the push
  # notification's body is that raw JSON, not nicely formatted prose. Readable (alertname,
  # status, labels are all in there), just not pretty. A nicer notification would need a small
  # transform proxy in front of ntfy, which is out of scope here.
  #
  # Routing is opt-in: the root route drops everything, and only the routes below reach the
  # phone. The first version sent the root route to ntfy as well, which delivered the stack's
  # own housekeeping alerts too -- Watchdog (fires permanently, by design), InfoInhibitor and
  # info-level CPUThrottlingHigh -- every 3 hours, burying the one alert that matters.
  # `routes` and `receivers` are lists, so setting them here replaces the chart's defaults
  # wholesale; that is also how the chart's own Watchdog -> "null" route got lost.
  config:
    global: {}
    route:
      receiver: "null"
      # namespace is in the key so a staging and a prod incident arrive as two notifications,
      # not one merged group.
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        # Watchdog is the dead man's switch (always firing while the pipeline works) and
        # InfoInhibitor only exists to mute info alerts -- neither is meant for a person.
        - matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
          receiver: "null"
        # The application's own alert: the PrometheusRule in charts/user-mgmt.
        - matchers:
            - service = "user-mgmt-backend"
          receiver: ntfy-user-mgmt-alerts
        # The stack's built-in rules (KubePodCrashLooping, KubeDeploymentReplicasMismatch,
        # KubeHpaMaxedOut, ...), but only for the application namespaces and only from
        # warning up. Platform noise and info-level alerts stay in the Alertmanager UI.
        - matchers:
            - namespace =~ "staging|prod"
            - severity =~ "warning|critical"
          receiver: ntfy-user-mgmt-alerts
    receivers:
      # Alertmanager requires every receiver a route names to exist, even an empty one.
      - name: "null"
      - name: ntfy-user-mgmt-alerts
        webhook_configs:
          - url: "https://ntfy.sh/user-mgmt-backend-alerts-0810489237b6"
            send_resolved: true

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

grafana:
  # Without this, Grafana's SQLite DB lives in an emptyDir and resets to blank on every pod
  # restart/recreation -- every manually created user (and the admin password) vanishes and
  # gets reseeded from whatever the admin-password Secret currently holds. This is why the
  # admin password kept changing across helm upgrades.
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: do-block-storage
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    # 256Mi limit OOMKilled on every cold start; 512Mi ran fine for ~8 minutes and then also
    # got OOMKilled (exit 137) -- this is ongoing growth (bleve indexing, plugin update
    # checks), not just a startup burst. 1Gi with headroom until this is watched over a full
    # day; the node has plenty of room (8GB, <75% used). Re-check `kubectl top pod` if it
    # recurs.
    limits:
      cpu: 300m
      memory: 1Gi
  # External access, same pattern as the other Ingresses on this cluster (vcs.linosteiner.ch,
  # argo.linosteiner.ch): Traefik + its Let's Encrypt certresolver, no cert-manager/Secret
  # needed. The DNS A record for grafana.linosteiner.ch -> the Traefik LoadBalancer IP
  # (129.212.193.64) is managed outside this repo (linosteiner.ch is not on DigitalOcean DNS)
  # and has to be created by hand.
  #
  # Grafana's own login (admin / the auto-generated password in the prometheus-stack-grafana
  # Secret) is what protects this -- there is no additional auth in front of it.
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    hosts:
      - grafana.linosteiner.ch
    path: /
    pathType: Prefix
    tls:
      - hosts:
          - grafana.linosteiner.ch
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Chart default; spelled out because dashboard #1 below (per-pod CPU/memory) relies on it.
  # This ships the chart's bundled "Kubernetes / Compute Resources / Pod", "... / Namespace
  # (Pods)", "... / Node" etc. dashboards, all backed by kube-state-metrics + node-exporter,
  # which are already scraped by this release's default ServiceMonitors.
  defaultDashboardsEnabled: true

  # Required for dashboard #2 below to actually load: `grafana.dashboards.*` only mounts the
  # JSON file onto disk at /var/lib/grafana/dashboards/<provider>/<name>.json -- it does NOT
  # register a provider that reads that directory. Setting dashboardProviders REPLACES the
  # chart's own auto-generated dashboardproviders.yaml wholesale (it's a raw file override,
  # not a merge) -- so the "sidecarProvider" entry that dashboard #1 (the sidecar-fed default
  # dashboards, watching /tmp/dashboards) depends on has to be repeated here verbatim,
  # alongside the "default" provider for this dashboard. Dropping either one made that set of
  # dashboards disappear from Grafana even though the files were still on disk. See
  # charts/grafana/values.yaml's `sidecar.dashboards.provider` for where these values come
  # from.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: sidecarProvider
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /tmp/dashboards
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Dashboard #2: the user_mgmt_service application dashboard, provisioned as code so it
  # survives a Grafana pod restart -- clicking a dashboard together in the UI does not satisfy
  # "befindet sich im Ops Repository" and does not survive an eviction like the one this
  # Grafana pod already had once.
  #
  # Titled "user_mgmt - Lasttest" since 2026-09-25: it shows ALL traffic including k6, and the
  # quiet-operation view without load tests is dashboard #4 below. Every dashboard here shades
  # the time a k6 Job was active (annotation on kube_job_status_active{namespace="k6"}).
  #
  # Three rows, with a namespace selector (staging/prod/All) at the top:
  #   Lasttest oder echt?  requests/s split by the backend's `source` label (loadtest = k6,
  #                user = everyone else), with a short how-to-read text
  #   Application  request rate per endpoint, response time (avg + p95), error rate (5xx with
  #                the alert threshold as a line, 4xx for context), requests per pod
  #   Scaling      HPA current/desired/max vs available replicas, cpu per pod as % of its
  #                request (the HPA's own metric, with its 70% target as a line), memory per pod
  # The second row is what the k6 load test (k6/) is read off: scale-out, the replicas
  # sharing the load, and `available` never reaching 0.
  #
  # The two dashed lines are hardcoded copies of monitoring.prometheusRule.errorRateThreshold
  # and backend.autoscaling.targetCPUUtilizationPercentage in charts/user-mgmt -- update them
  # here if those change.
  #
  # Metric names are Micrometer's default Spring Boot HTTP server timer
  # (http.server.requests -> http_server_requests_seconds_{count,sum,bucket} once exported via
  # micrometer-registry-prometheus). The `application` label matches
  # management.metrics.tags.application in user_mgmt_service's application.properties and
  # monitoring.prometheusRule.applicationTag in charts/user-mgmt/values.yaml -- keep all three
  # in sync if either changes. Verify the metric names against the live endpoint before
  # trusting this blindly:
  #   kubectl -n staging exec deploy/<release>-user-mgmt-backend -- \
  #     curl -s localhost:8081/actuator/prometheus | grep http_server_requests
  dashboards:
    default:
      user-mgmt-backend:
        json: |
          {
            "id": null,
            "uid": "user-mgmt-backend",
            "title": "user_mgmt - Lasttest",
            "tags": [
              "user-mgmt",
              "spring-boot"
            ],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 3,
            "refresh": "30s",
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "label": "Data source",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {
                    "text": "Prometheus",
                    "value": "prometheus"
                  },
                  "hide": 0
                },
                {
                  "name": "namespace",
                  "label": "Namespace",
                  "type": "query",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "query": "label_values(http_server_requests_seconds_count{application=\"user-mgmt-service\"}, namespace)",
                  "definition": "label_values(http_server_requests_seconds_count{application=\"user-mgmt-service\"}, namespace)",
                  "refresh": 2,
                  "sort": 1,
                  "multi": true,
                  "includeAll": true,
                  "current": {
                    "text": [
                      "All"
                    ],
                    "value": [
                      "$__all"
                    ]
                  },
                  "hide": 0
                }
              ]
            },
            "panels": [
              {
                "id": 10,
                "type": "row",
                "title": "Lasttest oder echt?",
                "collapsed": false,
                "panels": [],
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 0
                }
              },
              {
                "id": 11,
                "type": "text",
                "title": "So liest man dieses Dashboard",
                "gridPos": {
                  "h": 6,
                  "w": 8,
                  "x": 0,
                  "y": 1
                },
                "options": {
                  "mode": "markdown",
                  "content": "Dieses Dashboard zeigt **alle** Anfragen, auch die vom **k6-Lasttest**.\n\n- **Orange hinterlegte Zeiträume**: ein k6-Job lief.\n- Rechts: welcher Anteil vom Lasttest kommt und welcher von echten Nutzern.\n- Die Zeilen darunter (Durchsatz, Skalierung, CPU) sind das, was ein Lasttest nachweist.\n\nFür den normalen Betrieb ohne Lasttests: Dashboard **user_mgmt - Ruhiger Betrieb** (Menü *user_mgmt Dashboards* oben rechts)."
                }
              },
              {
                "id": 12,
                "type": "timeseries",
                "title": "Anfragen pro Sekunde: Lasttest vs. echte Nutzer",
                "description": "Nach dem Label source, das das Backend jeder Anfrage gibt: loadtest = k6 (am User-Agent erkannt) oder Header X-Load-Test, sonst echter Nutzer. Anfragen vor dem Backend-Update vom 25.09.2026 haben das Label noch nicht.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 6,
                  "w": 16,
                  "x": 8,
                  "y": 1
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "lineWidth": 1,
                      "fillOpacity": 25,
                      "stacking": {
                        "mode": "normal",
                        "group": "A"
                      }
                    }
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "loadtest"
                      },
                      "properties": [
                        {
                          "id": "displayName",
                          "value": "Lasttest (k6)"
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "orange"
                          }
                        }
                      ]
                    },
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "user"
                      },
                      "properties": [
                        {
                          "id": "displayName",
                          "value": "echte Nutzer"
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "green"
                          }
                        }
                      ]
                    },
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "unbekannt"
                      },
                      "properties": [
                        {
                          "id": "displayName",
                          "value": "ohne Kennung (vor dem Update)"
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "text"
                          }
                        }
                      ]
                    }
                  ]
                },
                "options": {
                  "legend": {
                    "displayMode": "list",
                    "placement": "bottom",
                    "showLegend": true
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "label_replace(sum by (source) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\", uri!~\"/actuator.*\"}[$__rate_interval])), \"source\", \"unbekannt\", \"source\", \"\")",
                    "legendFormat": "{{source}}"
                  }
                ]
              },
              {
                "id": 1,
                "type": "row",
                "title": "Application: rate, errors, duration",
                "collapsed": false,
                "panels": [],
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 7
                }
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Request Rate",
                "description": "Requests per second, per endpoint.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 8
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "mean",
                      "max",
                      "lastNotNull"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "sum by (namespace, method, uri) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} {{method}} {{uri}}"
                  }
                ]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Response Time (avg / p95)",
                "description": "Average and 95th percentile across all replicas. p95 needs the histogram buckets enabled in user_mgmt_service's application.properties.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 8
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "mean",
                      "max",
                      "lastNotNull"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "sum by (namespace) (rate(http_server_requests_seconds_sum{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval])) / sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} avg"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "B",
                    "expr": "histogram_quantile(0.95, sum by (namespace, le) (rate(http_server_requests_seconds_bucket{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval])))",
                    "legendFormat": "{{namespace}} p95"
                  }
                ]
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Error Rate",
                "description": "Share of responses by outcome. 5xx is the service failing; 4xx is the client being wrong (e.g. 401 on a bad password) and is shown for context only. The dashed line is the threshold of the UserMgmtBackendHighErrorRate alert (5% for 5 minutes).",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 16
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 5
                        }
                      ]
                    },
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10,
                      "thresholdsStyle": {
                        "mode": "dashed"
                      }
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "mean",
                      "max",
                      "lastNotNull"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "100 * (sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\", outcome=\"SERVER_ERROR\"}[$__rate_interval])) or 0 * sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))) / sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} 5xx"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "B",
                    "expr": "100 * (sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\", outcome=\"CLIENT_ERROR\"}[$__rate_interval])) or 0 * sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))) / sum by (namespace) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} 4xx"
                  }
                ]
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "Requests per Pod",
                "description": "How the requests are spread over the backend replicas. With several replicas the lines run close together; a new replica only receives traffic once its readinessProbe passes.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 16
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "mean",
                      "max",
                      "lastNotNull"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "sum by (namespace, pod) (rate(http_server_requests_seconds_count{application=\"user-mgmt-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{pod}}"
                  }
                ]
              },
              {
                "id": 6,
                "type": "row",
                "title": "Scaling: HPA and resources (backend)",
                "collapsed": false,
                "panels": [],
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 24
                }
              },
              {
                "id": 7,
                "type": "timeseries",
