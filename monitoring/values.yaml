      # Dashboard #4: "Ruhiger Betrieb" -- the quiet-operation counterpart of #2, which is now
      # the load-test dashboard. Only real users (source="user"), last 10 minutes as counts,
      # one bar per minute, response time, pods and the module_service circuit breaker.
      # Counts come from user_mgmt_activity_total{event, source}, which the backend
      # (UserActivityMetricsFilter) registers at 0 on startup: http_server_requests series only
      # appear with their first request, and increase()/rate() cannot see that first increment,
      # so a single registration on a quiet system never showed up there. The bars subtract the
      # counter from its value one interval earlier instead of using increase(), which
      # extrapolates and turns one event in a one-minute window into ~1.3 or 2.
