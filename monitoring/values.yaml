                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "max by (namespace) (kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"$namespace\", horizontalpodautoscaler=~\".*-backend-hpa\"})",
                    "legendFormat": "{{namespace}} current"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "B",
                    "expr": "max by (namespace) (kube_horizontalpodautoscaler_status_desired_replicas{namespace=~\"$namespace\", horizontalpodautoscaler=~\".*-backend-hpa\"})",
                    "legendFormat": "{{namespace}} desired"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "C",
                    "expr": "max by (namespace) (kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"$namespace\", horizontalpodautoscaler=~\".*-backend-hpa\"})",
                    "legendFormat": "{{namespace}} max"
