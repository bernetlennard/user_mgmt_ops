      # Dashboard #3: the module_service (Aufgabe 6), same approach as #2. Three rows, with the
      # same namespace selector:
      #   Application  request rate per endpoint, response time (avg/p50/p95), error rate (5xx
      #                with the ModuleServiceHighErrorRate threshold, 4xx for context), requests
      #                per pod -- from the module_service's own /metrics (prometheus_client).
      #   Resources    cpu and memory per pod against request and limit, throttling, restarts:
      #                what the vertical sizing in charts/user-mgmt is read off.
      #   Caller       the user_mgmt_service's side of the call: its REST client's requests,
      #                the circuit breaker's state, retries and rejected calls (Resilience4j,
      #                exported through Micrometer).
      # Series are selected by the Service name (service=~".+-module-service"), which the
      # ServiceMonitor puts on every scraped sample; the dashed 5% line is a hardcoded copy of
      # monitoring.prometheusRule.errorRateThreshold in charts/user-mgmt.
      module-service:
        json: |
          {
            "id": null,
            "uid": "module-service",
            "title": "module_service - Application Metrics",
            "tags": [
              "user-mgmt",
              "module-service",
              "fastapi"
            ],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 2,
            "refresh": "30s",
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "label": "Data source",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {
                    "text": "Prometheus",
                    "value": "prometheus"
                  },
                  "hide": 0
                },
                {
                  "name": "namespace",
                  "label": "Namespace",
                  "type": "query",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "query": "label_values(http_requests_total{service=~\".+-module-service\"}, namespace)",
                  "definition": "label_values(http_requests_total{service=~\".+-module-service\"}, namespace)",
                  "refresh": 2,
                  "sort": 1,
                  "multi": true,
                  "includeAll": true,
                  "current": {
                    "text": [
                      "All"
                    ],
                    "value": [
                      "$__all"
                    ]
                  },
                  "hide": 0
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "type": "row",
                "title": "Application: rate, errors, duration",
                "collapsed": false,
                "panels": [],
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 0
                }
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Request Rate",
                "description": "Requests per second per endpoint (route template). Probes and the /metrics scrape are not counted.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 1
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "mean",
                      "max",
                      "lastNotNull"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "sum by (namespace, method, path) (rate(http_requests_total{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} {{method}} {{path}}"
                  }
                ]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Response Time (avg / p50 / p95)",
                "description": "Server-side duration across all replicas, from the request histogram.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 1
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "mean",
                      "max",
                      "lastNotNull"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "A",
                    "expr": "sum by (namespace) (rate(http_request_duration_seconds_sum{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval])) / sum by (namespace) (rate(http_request_duration_seconds_count{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval]))",
                    "legendFormat": "{{namespace}} avg"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "B",
                    "expr": "histogram_quantile(0.50, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval])))",
                    "legendFormat": "{{namespace}} p50"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "C",
                    "expr": "histogram_quantile(0.95, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{service=~\".+-module-service\", namespace=~\"$namespace\"}[$__rate_interval])))",
                    "legendFormat": "{{namespace}} p95"
                  }
                ]
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Error Rate",
                "description": "Share of responses by status class. 5xx is the service failing (503 = MySQL unreachable); 4xx is a caller asking for something that does not exist (404 MODULE_NOT_FOUND) and is shown for context. The dashed line is the threshold of the ModuleServiceHighErrorRate alert (5% for 5 minutes).",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 9
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "thresholds": {
                      "mode": "absolute",
