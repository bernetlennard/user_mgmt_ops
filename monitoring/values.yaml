                        {
                          "color": "red",
                          "value": 5
                        }
                      ]
                    },
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 10,
                      "thresholdsStyle": {
                        "mode": "dashed"
                      }
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
