                  "expr": "sum(kube_job_status_active{namespace=\"k6\"}) > 0",
                  "step": "30s",
                  "titleFormat": "k6-Lasttest läuft",
                  "textFormat": "Ein k6-Job im Namespace k6 ist aktiv: die Anfragen in diesem Zeitraum kommen grösstenteils vom Lasttest."
