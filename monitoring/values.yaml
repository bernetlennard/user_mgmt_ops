                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "refId": "D",
                    "expr": "sum by (namespace) (kube_deployment_status_replicas_available{namespace=~\"$namespace\", deployment=~\".*-backend\"})",
                    "legendFormat": "{{namespace}} available"
                  }
                ]
              },
              {
                "id": 8,
                "type": "timeseries",
                "title": "CPU per Pod (% of request)",
                "description": "The metric the HPA scales on: cpu usage relative to the container's cpu request, not its limit. The dashed line is the HPA target (70%).",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 8,
                  "y": 25
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "thresholds": {
                      "mode": "absolute",
